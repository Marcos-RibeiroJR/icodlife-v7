# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml  —  Stack de produção mínima
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: icodlife_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: icodlife
      POSTGRES_USER: icodlife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_em_producao}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icodlife"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Não expõe porta externamente — só acessível via rede interna Docker
    networks: [icodlife]

  # ── Redis (cache / rate-limit) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: icodlife_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-troque_em_producao} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-troque_em_producao}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [icodlife]

  # ── API NestJS ──────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-icodlife/icodlife}/api:${IMAGE_TAG:-latest}
    container_name: icodlife_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://icodlife:${POSTGRES_PASSWORD}@postgres:5432/icodlife
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      UPLOAD_DIR: /app/uploads
    volumes:
      - api_uploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks: [icodlife]

  # ── Web Next.js ─────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-icodlife/icodlife}/web:${IMAGE_TAG:-latest}
    container_name: icodlife_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [icodlife]

  # ── Nginx reverso (HTTPS + proxy) ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: icodlife_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
    networks: [icodlife]

volumes:
  postgres_data:
  redis_data:
  api_uploads:

networks:
  icodlife:
    driver: bridge
