<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="760" fill="#FFFFFF"/>

  <text x="540" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#10151C">iCODLIFE — Arquitetura de alto nível</text>
  <text x="540" y="54" text-anchor="middle" font-size="12" fill="#64748B">Monorepo pnpm — 5 clientes, 1 API NestJS, 1 banco PostgreSQL</text>

  <!-- ── Camada de clientes ───────────────────────────────────────── -->
  <text x="40" y="92" font-size="12" font-weight="700" fill="#94A3B8">CLIENTES</text>

  <!-- Landing -->
  <g>
    <rect x="30" y="100" width="180" height="72" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="120" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#7B1E1E">apps/landing</text>
    <text x="120" y="146" text-anchor="middle" font-size="11" fill="#7B1E1E">Site institucional</text>
    <text x="120" y="162" text-anchor="middle" font-size="10" fill="#991B1B">icodlife.com.br · :3004</text>
  </g>

  <!-- Web paciente -->
  <g>
    <rect x="230" y="100" width="180" height="72" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="320" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#7B1E1E">apps/web</text>
    <text x="320" y="146" text-anchor="middle" font-size="11" fill="#7B1E1E">Portal do paciente</text>
    <text x="320" y="162" text-anchor="middle" font-size="10" fill="#991B1B">app.icodlife.com.br · :3000</text>
  </g>

  <!-- Doutor -->
  <g>
    <rect x="430" y="100" width="180" height="72" rx="12" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="520" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0B4F47">apps/doutor</text>
    <text x="520" y="146" text-anchor="middle" font-size="11" fill="#0B4F47">Portal do médico</text>
    <text x="520" y="162" text-anchor="middle" font-size="10" fill="#0F766E">doutor.icodlife.com.br · :3002</text>
  </g>

  <!-- Clinica -->
  <g>
    <rect x="630" y="100" width="180" height="72" rx="12" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="720" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0B4F47">apps/clinica</text>
    <text x="720" y="146" text-anchor="middle" font-size="11" fill="#0B4F47">Portal da clínica</text>
    <text x="720" y="162" text-anchor="middle" font-size="10" fill="#0F766E">clinica.icodlife.com.br · :3003</text>
  </g>

  <!-- Mobile -->
  <g>
    <rect x="830" y="100" width="180" height="72" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="920" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">apps/mobile</text>
    <text x="920" y="146" text-anchor="middle" font-size="11" fill="#1E293B">App paciente (Expo)</text>
    <text x="920" y="162" text-anchor="middle" font-size="10" fill="#475569">iOS / Android</text>
  </g>

  <!-- Setas clientes -> nginx -->
  <line x1="120" y1="172" x2="300" y2="222" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="172" x2="360" y2="222" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="172" x2="470" y2="222" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="172" x2="540" y2="222" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="172" x2="600" y2="222" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Nginx ────────────────────────────────────────────────────── -->
  <rect x="300" y="224" width="300" height="48" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Nginx — reverse proxy / TLS</text>
  <text x="450" y="260" text-anchor="middle" font-size="10" fill="#475569">roteia por domínio (server_name) para cada app</text>

  <line x1="450" y1="272" x2="450" y2="308" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── API ──────────────────────────────────────────────────────── -->
  <rect x="230" y="310" width="440" height="140" rx="12" fill="#10151C"/>
  <text x="450" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">apps/api — NestJS · /api/v1 · :3001</text>
  <text x="450" y="352" text-anchor="middle" font-size="10" fill="#94A3B8">JwtAuthGuard + RolesGuard · ValidationPipe(whitelist) · Prisma ORM</text>

  <g font-size="10.5" fill="#CBD5E1">
    <rect x="248" y="364" width="120" height="24" rx="6" fill="#171F29"/>
    <text x="308" y="380" text-anchor="middle">auth / users</text>

    <rect x="376" y="364" width="120" height="24" rx="6" fill="#171F29"/>
    <text x="436" y="380" text-anchor="middle">doctor</text>

    <rect x="504" y="364" width="120" height="24" rx="6" fill="#171F29"/>
    <text x="564" y="380" text-anchor="middle">clinic</text>

    <rect x="248" y="394" width="120" height="24" rx="6" fill="#171F29"/>
    <text x="308" y="410" text-anchor="middle">atendimento</text>

    <rect x="376" y="394" width="120" height="24" rx="6" fill="#171F29"/>
    <text x="436" y="410" text-anchor="middle">exames / saúde</text>

    <rect x="504" y="394" width="120" height="24" rx="6" fill="#171F29"/>
    <text x="564" y="410" text-anchor="middle">chat / telemed.</text>
  </g>
  <text x="450" y="440" text-anchor="middle" font-size="9.5" fill="#64748B">+ notifications · ai-health · vacinas · saúde mental · financeiro</text>

  <!-- Setas API -> DB/Redis/Storage -->
  <line x1="350" y1="450" x2="230" y2="500" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="450" x2="450" y2="500" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="450" x2="680" y2="500" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── PostgreSQL ───────────────────────────────────────────────── -->
  <rect x="140" y="502" width="200" height="72" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="240" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#0C447C">PostgreSQL 16</text>
  <text x="240" y="548" text-anchor="middle" font-size="10.5" fill="#0C447C">~65 tabelas · Prisma ORM</text>
  <text x="240" y="562" text-anchor="middle" font-size="9.5" fill="#185FA5">output custom: src/generated/prisma</text>

  <!-- ── Redis ────────────────────────────────────────────────────── -->
  <rect x="350" y="502" width="200" height="72" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="450" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#712B13">Redis</text>
  <text x="450" y="548" text-anchor="middle" font-size="10.5" fill="#712B13">Cache / rate-limit</text>
  <text x="450" y="562" text-anchor="middle" font-size="9.5" fill="#993C1D">sessões e filas leves</text>

  <!-- ── Storage ──────────────────────────────────────────────────── -->
  <rect x="580" y="502" width="200" height="72" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="680" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">Storage de arquivos</text>
  <text x="680" y="548" text-anchor="middle" font-size="10.5" fill="#633806">uploads/ · S3-compatible</text>
  <text x="680" y="562" text-anchor="middle" font-size="9.5" fill="#854F0B">exames, laudos, avatares</text>

  <!-- ── Nota cadastro único ──────────────────────────────────────── -->
  <rect x="30" y="610" width="1020" height="120" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="50" y="634" font-size="12.5" font-weight="700" fill="#1E293B">Cadastro único (ICODE)</text>
  <text x="50" y="654" font-size="11" fill="#475569">A tabela <tspan font-weight="700">User</tspan> é a espinha dorsal de todo o sistema: paciente, médico e equipe de clínica são</text>
  <text x="50" y="672" font-size="11" fill="#475569">sempre o mesmo registro em <tspan font-weight="700">users</tspan> — <tspan font-weight="700">Doctor</tspan> e <tspan font-weight="700">ClinicStaff</tspan> apenas estendem esse usuário com um perfil adicional</text>
  <text x="50" y="690" font-size="11" fill="#475569">(1 usuário : 0 ou 1 perfil de doutor). É por isso que "Meus Funcionários", "Base de Consultas" e o guichê de</text>
  <text x="50" y="708" font-size="11" fill="#475569">atendimento buscam sempre na mesma tabela <tspan font-weight="700">users</tspan> — ninguém tem cadastro duplicado entre os módulos.</text>
</svg>
